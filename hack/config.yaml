# CLI tool, only in development environment.
# https://goframe.org/pages/viewpage.action?pageId=3673173
gfcli:
  docker:
    build: "-a amd64 -s linux -p temp -ew"
    tagPrefixes:
      - vaebe
  gen:
    dao:
      - link: "mysql:root:123456@tcp(127.0.0.1:3306)/kkdl"
        tables: "short_url,short_url_visits,short_url_code,user"
        jsonCase: "CamelLower"
  # 工具编译配置
  build:
    name: "main"
    arch: "amd64"
    system: "linux"
    packSrc: "manifest/config,resource/public,resource/template"
    mod: ""
    cgo: 0